<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1C2B4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドキドキ野球">
<meta name="format-detection" content="telephone=no">
<title>ドキドキベースボール</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/background.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/fielding.css">
<link rel="stylesheet" href="css/subs.css">
<link rel="stylesheet" href="css/teamedit.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/challenge.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section id="screen-title" class="screen" data-screen="title"></section>
    <section id="screen-team" class="screen" data-screen="team" hidden></section>
    <section id="screen-teamedit" class="screen" data-screen="teamedit" hidden></section>
    <section id="screen-game" class="screen" data-screen="game" hidden></section>
    <section id="screen-settings" class="screen" data-screen="settings" hidden></section>
    <section id="screen-result" class="screen" data-screen="result" hidden></section>
  </div>
</div>
<div id="rotate-hint" role="alert" aria-live="assertive">
  <div class="rh-inner">
    <svg class="rh-phone" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
      <rect x="38" y="14" width="44" height="92" rx="10" fill="#FFD54A" stroke="#fff" stroke-width="5"/>
      <rect x="44" y="26" width="32" height="66" rx="3" fill="#1C2B4B"/>
      <circle cx="60" cy="99" r="3.5" fill="#1C2B4B"/>
      <circle cx="60" cy="58" r="11" fill="#fff"/><path d="M53 54q7 6 14 0M53 62q7-6 14 0" fill="none" stroke="#E5484D" stroke-width="2.4"/>
    </svg>
    <svg class="rh-arrow" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><path d="M22 60a38 38 0 0 1 66-26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M92 18l-2 22-20-6z" fill="#fff"/></svg>
    <p>横向きにしてあそんでね</p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
